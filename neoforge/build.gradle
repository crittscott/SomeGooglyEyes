plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases/' }
}

rootProject.configureGameTests(project)

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    mods {
        main {
            sourceSet sourceSets.main
        }
        somegoogly_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'neoforge.enableGameTest', 'true'
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // Runs receive common only through developmentNeoForge, which Architectury's runtime transformer rewrites
    // (@ExpectPlatform); listing it in loom.mods as well would load it untransformed and put its
    // packages in two modules.
    compileClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Optional at runtime; needed at compile time to subscribe to GeckoLib's render-layer event.
    compileOnly "com.geckolib:geckolib-neoforge-${rootProject.geckolib_minecraft}:$rootProject.geckolib_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

// Expands ${...} placeholders in neoforge.mods.toml (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    // This loader's resource root must be a data pack in development as well as in the bundled jar.
    from project(':common').file('src/main/resources/pack.mcmeta')
    var replaceProperties = rootProject.sharedModProperties + [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the gametest neoforge.mods.toml (this module's own resource).
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_license                  : mod_license,
            mod_version                  : mod_version,
            neoforge_version_range       : neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            minecraft_version_range      : minecraft_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    filesMatching('pack.mcmeta') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

// The bundled common output is the production artifact.
jar {
    archiveClassifier = 'dev'
}

tasks.named('assemble') {
    dependsOn shadowJar
}

loom.getNeoForge().convertAccessWideners(tasks.named('shadowJar'), 'somegoogly.accesswidener')

// Architectury launches common from its development JAR, including its processed resources.
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach {
    dependsOn project(':common').tasks.named('jar')
}
