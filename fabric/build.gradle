plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    main {
        java {
            // Shared GeckoLib render integration: one copy compiled into each loader jar against that
            // loader's own compile-only GeckoLib artifact. Only GeckoCompatImpl stays per-loader.
            srcDir rootProject.file('gecko/src/main/java')
        }
    }
    gametest {
        java {
            srcDir project(':common').file('src/gametest/java')
            srcDir file('src/gametest/java')
        }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    accessWidenerPath = project(':common').file('src/main/resources/somegoogly.accesswidener')

    mods {
        main {
            sourceSet sourceSets.main
        }
        somegoogly_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            name 'Game Test Server'
            vmArg '-Dfabric-api.gametest'
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Optional at runtime; needed at compile time by Fabric's GeckoLib render adapter.
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-1.21.1:$rootProject.geckolib_version"

    // common's source uses javax.annotation.Nullable; loader compilation doesn't inherit common's compileOnly deps.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

// Expands ${...} placeholders in fabric.mod.json (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version,
            geckolib_version: geckolib_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }

    from(project(':common').file('src/main/resources/somegoogly.accesswidener'))
}

// Expands ${...} placeholders in the gametest dev-mod's own fabric.mod.json.
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            fabric_loader_version: fabric_loader_version, fabric_api_version: fabric_api_version,
            mod_version: mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
