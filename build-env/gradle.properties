# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 0.8.3
maven_group = com.github.crittscott.somegoogly
archives_name = somegoogly
enabled_platforms = fabric,forge,neoforge

# Must match SomeGooglyCommon.MOD_ID and every loader's metadata.
mod_id = somegoogly
# The human-readable display name for the mod.
mod_name = Some Googly Eyes
# SPDX license identifier used by every loader's metadata.
mod_license = GPL-3.0
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors = crittscott
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description = A revival and enhancement of iChun's Googly Eyes.
# Stable project homepage; source and issue URLs are derived from this.
mod_homepage = https://github.com/crittscott/SomeGooglyEyes

# Build tools
# Java toolchain for compilation, Javadoc, and runs; also the Java version Fabric's metadata requires.
java_version = 21
# Java level of the Mixin configs Forge and NeoForge read, which their Mixin must recognize.
mixin_java_version = 21
# Gradle plugins, declared in settings.gradle.
loom_version = 1.17.493
architectury_plugin_version = 3.5.170
shadow_version = 9.4.3
# Compile-only nullability annotations, declared once for every module.
jsr305_version = 3.0.2

# Minecraft properties
# Loader metadata pins this exact release: the rendering internals, access rules, and Mixins target it.
minecraft_version = 1.21.1
# Data-pack format of this release; pack.mcmeta files take it from here.
pack_format = 48
# Mojang official mappings layered with Parchment. See https://parchmentmc.org/docs/getting-started
parchment_minecraft = 1.21.1
parchment_version = 2024.11.17

# Loaders
# The exact Forge release for compilation and development runs. Loader metadata accepts it and every later
# release within its major version.
forge_version = 52.1.2
# The exact NeoForge release for compilation and development runs. Loader metadata accepts it and every
# later release within its release line.
neoforge_version = 21.1.209
# NeoForge's JavaFML loader has its own version independent of the NeoForge release number.
neoforge_loader_version_range = [1,)
fabric_loader_version = 0.16.14
fabric_api_version = 0.102.1+1.21.1

# Dependencies
# Fabric configuration parser; bundled with the Fabric artifact.
nightconfig_version = 3.8.3
# Optional at runtime; the compile-only GeckoLib integration API.
geckolib_minecraft = 1.21.1
geckolib_version = 4.7.4
# Forge development runs only: the MixinExtras GeckoLib's Mixins need.
mixinextras_version = 0.4.1
# NeoForge development runs only: the Modrinth version id of Heads 2.1.1 for 1.21.1, whose heads take googly eyes.
heads_version = ujWQDDXJ
# NeoForge development runs only: the CurseForge file id of Twilight Forest 4.8.3345 for 1.21.1.
twilight_version = 7797302
