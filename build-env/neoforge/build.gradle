plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases/' }
}

rootProject.configureGameTests(project)

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    mods {
        main {
            sourceSet sourceSets.main
        }
        somegoogly_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'neoforge.enabledGameTestNamespaces', mod_id
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // Runs receive common only through developmentNeoForge, which Architectury's runtime transformer rewrites
    // (@ExpectPlatform); listing it in loom.mods as well would load it untransformed and put its
    // packages in two modules.
    compileClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_compile_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

// Expands ${...} placeholders in neoforge.mods.toml (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the gametest neoforge.mods.toml (this module's own resource).
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_license                  : mod_license,
            mod_version                  : mod_version,
            neoforge_version_range       : neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            minecraft_version_range      : minecraft_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // The common refmap maps to Fabric's intermediary names; this loader runs on Mojang names, which the
    // common Mixins already use, so they must apply without it.
    exclude 'somegoogly-common.refmap.json'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    // NeoForge reads access transformers, not wideners; dev runs apply the widener directly.
    atAccessWideners.add loom.accessWidenerPath.get().asFile.name
}
