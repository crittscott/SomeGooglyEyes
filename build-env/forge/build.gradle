plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

rootProject.configureGameTests(project)
// Shared GeckoLib render integration: one copy compiled into each loader jar against that loader's
// own compile-only GeckoLib artifact. Only GeckoCompatImpl stays per-loader.
sourceSets.main.java.srcDir rootProject.file('gecko/src/main/java')

loom {
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somegoogly_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'forge.enabledGameTestNamespaces', mod_id
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // Runs receive common through loom.mods; adding it to the runtime classpath as well puts its
    // packages in two modules, which the module system rejects.
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_compile_version"

    // Optional at runtime; needed at compile time by the GeckoLib render bridge. Not remapped:
    // GeckoLib's Forge artifacts are already usable as-is.
    compileOnly "software.bernie.geckolib:geckolib-forge-${rootProject.minecraft_version}:$rootProject.geckolib_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

// Loom cannot convert the common access widener into a jar that already contains an access
// transformer, so Forge carries its own and this check keeps it a superset of the widener.
def commonAccessWidener = rootProject.file('common/src/main/resources/somegoogly.accesswidener')
def forgeAccessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

tasks.register('verifyCommonAccessMirror') {
    inputs.files(commonAccessWidener, forgeAccessTransformer)

    doLast {
        def expectedEntries = commonAccessWidener.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') && !it.startsWith('accessWidener') }
                .collect { line ->
                    def parts = line.split(/\s+/)
                    def owner = parts[2].replace('/', '.')
                    if (parts[0] == 'accessible' && parts[1] == 'class' && parts.length == 3) {
                        return "public $owner".toString()
                    }
                    if (parts[0] == 'accessible' && parts[1] == 'field' && parts.length == 5) {
                        return "public $owner ${parts[3]}".toString()
                    }
                    if (parts[0] == 'accessible' && parts[1] == 'method' && parts.length == 5) {
                        return "public $owner ${parts[3]}${parts[4]}".toString()
                    }
                    throw new GradleException("verifyCommonAccessMirror cannot translate access widener entry: $line")
                }

        def forgeEntries = forgeAccessTransformer.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') }
                .toSet()
        def missing = expectedEntries.findAll { !forgeEntries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Forge access transformer is missing common entries: $missing")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyCommonAccessMirror')
}

// Expands ${...} placeholders in mods.toml (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the gametest mods.toml (this module's own resource).
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_license               : mod_license,
            mod_version               : mod_version,
            forge_version_range       : forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            minecraft_version_range   : minecraft_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
