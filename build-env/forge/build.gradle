plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

rootProject.configureGameTests(project)

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    mods {
        main {
            sourceSet sourceSets.main
        }
        somegoogly_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'forge.enabledGameTestNamespaces', mod_id
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // Runs receive common only through developmentForge, which Architectury's runtime transformer rewrites
    // (@ExpectPlatform); listing it in loom.mods as well would load it untransformed and put its
    // packages in two modules.
    compileClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_compile_version"

    // Optional at runtime; needed at compile time by the GeckoLib render integration. Not remapped:
    // GeckoLib's Forge artifacts are already usable as-is.
    compileOnly "software.bernie.geckolib:geckolib-forge-${rootProject.minecraft_version}:$rootProject.geckolib_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

// Expands ${...} placeholders in mods.toml (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the gametest mods.toml (this module's own resource).
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_license               : mod_license,
            mod_version               : mod_version,
            forge_version_range       : forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            minecraft_version_range   : minecraft_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    // Forge reads access transformers, not wideners; dev runs apply the widener directly.
    atAccessWideners.add loom.accessWidenerPath.get().asFile.name
}
