architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file('src/main/resources/somegoogly.accesswidener')
}

dependencies {
    compileOnly "io.github.llamalad7:mixinextras-common:$rootProject.mixinextras_version"

    // Supplies the Mixin annotations for the common Mixins. Do NOT use Fabric Loader API from common.
    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Optional at runtime; needed at compile time by the GeckoLib render integration.
    compileOnly "com.geckolib:geckolib-common-${rootProject.geckolib_minecraft}:$rootProject.geckolib_version"
}
