architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file('src/main/resources/somegoogly.accesswidener')
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    modCompileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"
}

// Expands the ${mod_id} placeholder in pack.mcmeta once here, rather than duplicating the same
// filesMatching block in every loader that bundles this module's resources.
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_id', mod_id

    filesMatching('pack.mcmeta') {
        expand mod_id: mod_id
    }
}

// The canonical source remains in common so Loom can widen common compilation. The Fabric module
// packages it beside fabric.mod.json; Forge supplies equivalent runtime access through patches/AT.
tasks.named('jar', Jar).configure {
    exclude 'somegoogly.accesswidener'
}
