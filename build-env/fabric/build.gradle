plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

rootProject.configureGameTests(project)
// Shared GeckoLib render integration: one copy compiled into each loader jar against that loader's
// own compile-only GeckoLib artifact. Only GeckoCompatImpl stays per-loader.
sourceSets.main.java.srcDir rootProject.file('gecko/src/main/java')

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'somegoogly.refmap.json'
    }

    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somegoogly_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            name 'Game Test Server'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/gametest-report.xml"
            source sourceSets.gametest
        }
    }
}

// The GameTest server reuses run/world between launches; clear it so entities and eye state left by
// one GameTest run cannot leak into the next.
def gameTestWorldDirectory = layout.projectDirectory.dir('run/world')
tasks.named('runGameTestServer').configure {
    doFirst {
        project.delete(gameTestWorldDirectory)
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Optional at runtime; needed at compile time by the GeckoLib render bridge.
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:$rootProject.geckolib_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

// Expands ${...} placeholders in fabric.mod.json (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the gametest fabric.mod.json (this module's own resource).
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_version          : mod_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
