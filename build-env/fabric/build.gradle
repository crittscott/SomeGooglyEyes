plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

rootProject.configureGameTests(project)

// Scripted-client tests: a Fabric-only source set whose tests stage scenes and take screenshots for review
// (docs/client-test-plan.md). They need a physical client, which no other loader's GameTest framework drives.
sourceSets {
    clientGametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

// Client settings that Fabric reads only at game start. Each group gets its own run and run directory, with
// its config file copied into place before launch; the tests read the group from a system property.
def clientGameTestLaunchGroups = ['hideAll', 'hideEntities', 'hideMods']

// The client-test framework's network synchronizer can stop the game when it loses track of a packet (seen after a
// /reload). The tests wait generously and poll server state instead of relying on lockstep packet handling.
def clientGameTestNoNetworkSync = '-Dfabric.client.gametest.disableNetworkSynchronizer=true'

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'somegoogly.refmap.json'
    }

    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somegoogly_gametest {
            sourceSet sourceSets.gametest
        }
        somegoogly_clientgametest {
            sourceSet sourceSets.clientGametest
        }
    }

    runs {
        gameTestServer {
            server()
            name 'Game Test Server'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/gametest-report.xml"
            source sourceSets.gametest
        }
        clientGameTest {
            client()
            name 'Client Game Test'
            vmArg '-Dfabric.client.gametest'
            vmArg clientGameTestNoNetworkSync
            vmArg "-Dsomegoogly.clientgametest.fixtures=${file('src/clientGametest/fixtures')}"
            source sourceSets.clientGametest
            runDir 'run/clientgametest'
        }
        clientGameTestLaunchGroups.each { group ->
            register("clientGameTest${group.capitalize()}") {
                client()
                name "Client Game Test (${group})"
                vmArg '-Dfabric.client.gametest'
                vmArg clientGameTestNoNetworkSync
                vmArg "-Dsomegoogly.clientgametest.group=${group}"
                source sourceSets.clientGametest
                runDir "run/clientgametest-${group}"
            }
        }
    }
}

// The dedicated server that the multiplayer client tests start runs in the client's own run directory. Accept
// the EULA there, and clear the server world a previous run left, before every launch.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    doFirst {
        def runDirectory = file('run/clientgametest')
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        delete(new File(runDirectory, 'world'))
    }
}

clientGameTestLaunchGroups.each { group ->
    def prepare = tasks.register("prepareClientGameTest${group.capitalize()}", Copy) {
        from file("src/clientGametest/launch/${group}")
        into file("run/clientgametest-${group}/config")
    }
    tasks.matching { it.name == "runClientGameTest${group.capitalize()}" }.configureEach {
        dependsOn prepare
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Fabric has no native config parser. Bundle both NightConfig modules in the loader artifact.
    implementation "com.electronwill.night-config:core:$rootProject.nightconfig_version"
    implementation "com.electronwill.night-config:toml:$rootProject.nightconfig_version"
    include "com.electronwill.night-config:core:$rootProject.nightconfig_version"
    include "com.electronwill.night-config:toml:$rootProject.nightconfig_version"

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Optional at runtime; needed at compile time to subscribe to GeckoLib's render-layer event.
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-${rootProject.geckolib_minecraft}:$rootProject.geckolib_version"
    // Also loaded in development runs, so the integration's gate and listener run; never bundled. Not
    // transitive, so GeckoLib's declared dependencies cannot change the versions this build resolves for
    // development runs.
    modLocalRuntime("software.bernie.geckolib:geckolib-fabric-${rootProject.geckolib_minecraft}:$rootProject.geckolib_version") {
        transitive = false
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

// Expands ${...} placeholders in fabric.mod.json and this module's Mixin config.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the gametest fabric.mod.json and the shared fixtures' pack.mcmeta.
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_version          : mod_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
    ] + rootProject.packFormatProperties
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the client-test fabric.mod.json and its built-in datapacks' pack.mcmeta.
tasks.named('processClientGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_version          : mod_version,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
    ] + rootProject.packFormatProperties
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', '**/pack.mcmeta']) {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
