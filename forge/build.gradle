plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

rootProject.configureGameTests(project)

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    forge {
        // Forge reads access transformers, not wideners: remapping converts common's widener into the
        // production JAR's accesstransformer.cfg. Development runs apply the widener directly.
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig 'somegoogly-common.mixins.json'
    }

    mods {
        main {
            sourceSet sourceSets.main
        }
        somegoogly_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        // Dev runs load common's refmap, which maps to Fabric's intermediary names; this loader runs on the
        // Mojang names the common Mixins are written against, so they must resolve without it.
        configureEach {
            property 'mixin.env.disableRefMap', 'true'
        }
        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'forge.enabledGameTestNamespaces', mod_id
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // Runs receive common only through developmentForge, which Architectury's runtime transformer rewrites
    // (@ExpectPlatform); listing it in loom.mods as well would load it untransformed and put its
    // packages in two modules.
    compileClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.minecraft_version-$rootProject.forge_version"

    // Optional at runtime; needed at compile time to subscribe to GeckoLib's render-layer event.
    modCompileOnly "software.bernie.geckolib:geckolib-forge-${rootProject.geckolib_minecraft}:$rootProject.geckolib_version"
    // Also loaded in development runs, so the integration's gate and listener run; never bundled. Not
    // transitive: Forge-family runs would load its dependencies as second copies of the game's libraries.
    modLocalRuntime("software.bernie.geckolib:geckolib-forge-${rootProject.geckolib_minecraft}:$rootProject.geckolib_version") {
        transitive = false
    }
    // GeckoLib's Mixins need MixinExtras, which this Forge does not ship. Not a mod dependency: remapping
    // would strip the common classes it nests.
    localRuntime "io.github.llamalad7:mixinextras-forge:$rootProject.mixinextras_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

// Expands ${...} placeholders in mods.toml, common's pack.mcmeta, and this module's Mixin configs.
tasks.named('processResources', ProcessResources).configure {
    // This loader's resource root must be a data pack in development as well as in the bundled jar.
    from project(':common').file('src/main/resources/pack.mcmeta')
    var replaceProperties = rootProject.sharedModProperties + [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '*.mixins.json']) {
        expand replaceProperties
    }
}

// Expands ${...} placeholders in the gametest mods.toml and the shared fixtures' pack.mcmeta.
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_license               : mod_license,
            mod_version               : mod_version,
            forge_version_range       : forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            minecraft_version_range   : minecraft_version_range,
    ] + rootProject.packFormatProperties
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // The common refmap maps to Fabric's intermediary names; this loader runs on Mojang names, which the
    // common Mixins already use, so they must apply without it.
    exclude 'somegoogly-common.refmap.json'
    filesMatching('pack.mcmeta') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
