plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

sourceSets {
    gametest {
        java {
            srcDir project(':common').file('src/gametest/java')
            srcDir file('src/gametest/java')
        }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        main {
            sourceSet sourceSets.main
        }
        somegoogly_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'forge.enabledGameTestNamespaces', mod_id
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    // Forge dev runs load common through Architectury's transformed development module. Adding the
    // raw common jar to the runtime classpath gives Forge's module layer duplicate common packages.
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_compile_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Architectury API has no Forge artifact for Minecraft 1.21.1. Forge-facing replacements for
    // the shared runtime API calls belong to the source port; the Gradle plugin remains usable.

    // GeckoLib — soft dependency. compileOnly so the mod still runs without it (gated at runtime by
    // a loaded-mod check). Not remapped: GeckoLib's own Forge artifacts are already usable as-is.
    compileOnly "software.bernie.geckolib:geckolib-forge-1.21.1:$rootProject.geckolib_version"

    // common's source uses javax.annotation.Nullable; loader compilation doesn't inherit common's compileOnly deps.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

// Expands ${...} placeholders in mods.toml (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            geckolib_version: geckolib_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties + [project: project]
    }
}

// Expands ${...} placeholders in the gametest dev-mod's own mods.toml.
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            mod_license: mod_license, mod_version: mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
