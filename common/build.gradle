architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file('src/main/resources/somegoogly.accesswidener')

    // The common Mixins need their own refmap. Architectury names it in the production Mixin configs and
    // rewrites it to SRG names for Forge, so the configs must not name it: development runs use Mojang names.
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'somegoogly-common.refmap.json'
    }
}

dependencies {
    // Supplies Fabric's @Environment annotation types, which the common Minecraft jar references, and the
    // Mixin annotations for the common Mixins. Do NOT use Fabric Loader API from common.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Optional at runtime; needed at compile time by the GeckoLib render integration. GeckoLib publishes no
    // common artifact for this version, so common compiles against the Fabric one, whose API Forge's matches.
    modCompileOnly("software.bernie.geckolib:geckolib-fabric-${rootProject.geckolib_minecraft}:$rootProject.geckolib_version") {
        transitive = false
    }
}

// Expands ${...} placeholders in pack.mcmeta and the common Mixin configs.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties
    inputs.properties replaceProperties

    filesMatching(['pack.mcmeta', '*.mixins.json']) {
        expand replaceProperties
    }
}
