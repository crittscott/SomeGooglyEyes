# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 0.8.3
maven_group = com.github.crittscott.somegoogly
archives_name = somegoogly
enabled_platforms = fabric,forge,neoforge

# Must match SomeGooglyCommon.MOD_ID and every loader's metadata.
mod_id = somegoogly
# The human-readable display name for the mod.
mod_name = Some Googly Eyes
# SPDX license identifier used by every loader's metadata.
mod_license = GPL-3.0
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors = crittscott
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description = A revival and enhancement of iChun's Googly Eyes.
# Stable project homepage; source and issue URLs are derived from this.
mod_homepage = https://github.com/crittscott/SomeGooglyEyes

# Minecraft properties
minecraft_version = 1.21.1
# Pinned because the rendering internals, access rules, and Mixins target this exact release.
minecraft_version_range = [1.21.1]
# Loader ranges are runtime compatibility declarations for loader metadata.
forge_version_range = [52.1.2,53)
# Forge's loader range uses the Forge/FML major version.
forge_loader_version_range = [52,53)
neoforge_version_range = [21.1.34,21.2)
# NeoForge's JavaFML loader has its own version independent of the NeoForge release number.
neoforge_loader_version_range = [1,)
# Mojang official mappings layered with Parchment. See https://parchmentmc.org/docs/getting-started
parchment_minecraft = 1.21.1
parchment_version = 2024.11.17

# Dependencies
fabric_loader_version = 0.16.14
fabric_api_version = 0.102.1+1.21.1
# Optional at runtime; common compiles its GeckoLib render integration against this version.
geckolib_version = 4.7.4
# NeoForge development runs only: the Modrinth version id of Heads 2.1.1 for 1.21.1, whose heads take googly eyes.
heads_version = ujWQDDXJ
# Gradle needs one exact Forge artifact for compilation and development runs. Keep it aligned with
# the minimum supported runtime declared by forge_version_range above.
forge_compile_version = 1.21.1-52.1.2
neoforge_compile_version = 21.1.34
